<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beautiful Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f1f5f9;
      padding: 30px;
    }

    form {
      background: #ffffff;
      padding: 20px 30px;
      margin-bottom: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    fieldset {
      border: none;
    }

    legend {
      font-size: 1.5rem;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 500;
      color: #374151;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      transition: 0.3s;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 5px #93c5fd;
    }

    input[type="radio"],
    input[type="checkbox"] {
      margin-right: 8px;
      transform: scale(1.2);
    }

    input[type="submit"] {
      background-color: #2563eb;
      color: white;
      padding: 10px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #1e40af;
    }
  </style>
</head>
<body>

  <!-- แบบฟอร์มข้อมูลทั่วไป -->
  <form>
    <fieldset>
      <legend>Register</legend>
      <label for="Firstname">Firstname</label>
      <input type="text" placeholder="Enter your Firstname" />

      <label for="Lastname">Lastname</label>
      <input type="text" placeholder="Enter your Lastname" />

      <input type="submit" value="Submit" />
    </fieldset>
  </form>

  <!-- แบบฟอร์มเลือกเพศ -->
  <form>
    <fieldset>
      <legend>Gender</legend>
      <label><input type="radio" name="gender" value="male" /> Male</label>
      <label><input type="radio" name="gender" value="female" /> Female</label>

      <input type="submit" value="Submit" />
    </fieldset>
  </form>

  <!-- แบบฟอร์ม Checkbox -->
  <form>
    <fieldset>
      <legend>Checkbox</legend>
      <label><input type="checkbox" value="value1" name="checkbox1" /> Option 1</label>
      <label><input type="checkbox" value="value2" name="checkbox2" /> Option 2</label>
      <label><input type="checkbox" value="value3" name="checkbox3" /> Option 3</label>

      <input type="submit" value="Submit" />
    </fieldset>
  </form>

</body>
</html>
