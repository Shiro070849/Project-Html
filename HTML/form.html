<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
    form {
      background: #ffffff;
      padding: 20px 30px;
      margin-bottom: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>Register</legend>
            <label for="Firstname">Firstname</label>
            <input type="text" placeholder="Enter your Firstname">
            <br>
            <label for="Lastname">Lastname</label>
            <input type="text" placeholder="Enter your Listname">
            <br>
            <input type="submit" value="ตกลง">
            <input type="submit" value="ยกเลิก">
        </fieldset>
    </form>
    <form >
        <fieldset>
            <legend>Gender</legend>
            <input type="radio" name="gender" value="male"> Male 
            <br>
            <input type="radio" name="gender" value="female"> Female
            <br>
            <input type="submit" value="submit">
        </fieldset>
    </form>
    <form>
        <fieldset>
            <legend>Checkbox</legend>
            <input type="checkbox" value="value1" name="checkbox1">
            <input type="checkbox" value="value2" name="checkbox2">
            <input type="checkbox" value="value3" name="checkbox3">
            <br>
            <input type="submit" value="submit">
        </fieldset>
    </form>
</body>
</html>
